<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#D32F2F">
  <title>Chofer — Control Electoral 2026</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#D32F2F">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Electoral">

  <link rel="icon" type="image/png" href="assets/img/logo-lista1.png">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div class="header-logo" id="header-logo"></div>
      <div class="header-user">
        <div class="sync-indicator-wrap" id="sync-indicator"></div>
        <div id="header-user"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container container-sm">

      <div id="estado-dia-box" class="alert alert-info mb-4">
        <span id="estado-dia-texto">Verificando estado del día...</span>
      </div>

      <div class="card mb-4">
        <div class="card-header">
          <h2 class="card-title">Registrar viaje</h2>
          <span class="badge badge-rojo" id="contador-hoy">0 hoy</span>
        </div>
        <div class="card-body">
          <form id="form-viaje">

            <div class="form-group">
              <label class="form-label" for="viaje-barrio">
                Barrio de salida <span class="req">*</span>
              </label>
              <input type="text" id="viaje-barrio" class="form-input" placeholder="Ej: San Miguel, Centro" autocapitalize="words" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="viaje-colegio">
                Colegio destino <span class="req">*</span>
              </label>
              <select id="viaje-colegio" class="form-select" required>
                <option value="">— Seleccionar —</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="viaje-cantidad">
                Cantidad de personas <span class="req">*</span>
              </label>
              <input type="number" id="viaje-cantidad" class="form-input" min="1" inputmode="numeric" placeholder="Ej: 4" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="viaje-obs">Observaciones</label>
              <input type="text" id="viaje-obs" class="form-input" placeholder="Opcional">
            </div>

            <button type="submit" id="btn-viaje" class="btn btn-primary btn-lg btn-block">
              Registrar viaje
            </button>

          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Mis viajes de hoy</h2>
          <div class="flex gap-2">
            <span class="badge badge-info" id="total-personas">0 personas</span>
            <button class="btn btn-ghost btn-sm" id="btn-refresh">🔄</button>
          </div>
        </div>
        <div class="card-body" id="lista-viajes">
          <p class="text-2 text-center">Cargando...</p>
        </div>
      </div>

    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/cache.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    (async function () {

      const usuario = await AUTH.proteger(['CHOFER', 'ADMIN']);
      if (!usuario) return;

      AUTH.renderHeaderLogo();
      AUTH.renderHeaderUsuario(usuario);

      // ⭐ Iniciar SYNC
      SYNC.iniciar();
      setInterval(() => SYNC._actualizarIndicadores(), 2000);

      let estadoDia = 'CERRADO';
      let escuelas = [];
      let botonBloqueado = false;

      // ============================================================
      // ESTADO DEL DÍA
      // ============================================================
      async function verificarEstadoDia() {
        try {
          const data = await API.estadoDia();
          estadoDia = data.estado_dia;
          const box = document.getElementById('estado-dia-box');
          const texto = document.getElementById('estado-dia-texto');
          if (estadoDia === 'ABIERTO') {
            box.className = 'alert alert-exito mb-4';
            texto.innerHTML = '✅ <strong>Día ABIERTO</strong>';
          } else {
            box.className = 'alert alert-alerta mb-4';
            texto.innerHTML = '🔒 <strong>Día CERRADO</strong>';
          }
        } catch (e) { console.error(e); }
      }

      // ============================================================
      // CARGAR ESCUELAS (usa cache)
      // ============================================================
      async function cargarEscuelas() {
        try {
          escuelas = await DATA.escuelas();
          const sel = document.getElementById('viaje-colegio');
          sel.innerHTML = '<option value="">— Seleccionar —</option>';
          escuelas.forEach(e => {
            const opt = document.createElement('option');
            opt.value = e.id_escuela;
            opt.textContent = e.nombre;
            sel.appendChild(opt);
          });
        } catch (e) { console.error(e); }
      }

      // ============================================================
      // REGISTRAR VIAJE (con SYNC)
      // ============================================================
      document.getElementById('form-viaje').addEventListener('submit', (e) => {
        e.preventDefault();
        if (estadoDia !== 'ABIERTO') { UI.toast('El día no está abierto', 'alerta'); return; }
        if (botonBloqueado) return;

        const btn = document.getElementById('btn-viaje');
        const barrio = document.getElementById('viaje-barrio').value.trim();
        const colegio = document.getElementById('viaje-colegio').value;
        const cantidad = document.getElementById('viaje-cantidad').value;
        const obs = document.getElementById('viaje-obs').value.trim();

        if (!barrio || !colegio || !cantidad) {
          UI.toast('Completá barrio, colegio y cantidad', 'error');
          return;
        }

        // Bloqueo temporal
        botonBloqueado = true;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Guardando...';

        try {
          SYNC.encolar('viaje', {
            id_escuela_destino: colegio,
            cantidad_personas: cantidad,
            barrio: barrio,
            observaciones: obs
          });

          UI.toast('✅ Guardado localmente', 'exito', 1500);

          // Limpiar solo cantidad y obs (mantener barrio y colegio para el próximo viaje)
          document.getElementById('viaje-cantidad').value = '';
          document.getElementById('viaje-obs').value = '';
          document.getElementById('viaje-cantidad').focus();

          cargarViajes();

        } catch (err) {
          UI.toast('Error al guardar: ' + err.message, 'error');
        } finally {
          setTimeout(() => {
            botonBloqueado = false;
            btn.disabled = false;
            btn.textContent = 'Registrar viaje';
          }, 300);
        }
      });

      // ============================================================
      // CARGAR VIAJES (backend + cola local)
      // ============================================================
      async function cargarViajes() {
        const cont = document.getElementById('lista-viajes');
        try {
          // Viajes confirmados en el backend
          const confirmados = await API.misViajes();

          // Viajes pendientes en la cola local
          const cola = SYNC._leerCola('viaje');
          const pendientes = cola.map(c => ({
            id_viaje: c.id_local,
            id_escuela_destino: c.datos.id_escuela_destino,
            cantidad_personas: c.datos.cantidad_personas,
            barrio: c.datos.barrio,
            hora_registro: c.timestamp,
            estado: 'PENDIENTE'
          }));

          const todos = [...confirmados, ...pendientes];
          const totalPersonas = todos.reduce((s, v) => s + Number(v.cantidad_personas || 0), 0);

          document.getElementById('contador-hoy').textContent = todos.length + ' viajes';
          document.getElementById('total-personas').textContent = totalPersonas + ' personas';

          if (todos.length === 0) {
            cont.innerHTML = '<p class="text-2 text-center">Sin viajes registrados</p>';
            return;
          }

          const ultimos = todos.slice(-20).reverse();
          cont.innerHTML = ultimos.map(v => {
            const esc = escuelas.find(e => e.id_escuela === v.id_escuela_destino);
            const escNombre = esc ? esc.nombre : v.id_escuela_destino;
            return `
              <div class="flex-between" style="padding: 10px 0; border-bottom: 1px solid var(--borde-2);">
                <div>
                  <div class="font-semibold">${UTILS.escaparHTML(escNombre)}</div>
                  <div class="text-xs text-2">
                    🚗 desde <strong>${UTILS.escaparHTML(v.barrio || '—')}</strong>
                    · ${UTILS.formatearHora(v.hora_registro)}
                    ${v.estado === 'PENDIENTE' ? ' · <span class="badge badge-alerta">⏳ Sync</span>' : ' · <span class="badge badge-exito">✅</span>'}
                  </div>
                </div>
                <div class="text-xl font-bold text-rojo">${v.cantidad_personas}</div>
              </div>
            `;
          }).join('');
        } catch (err) {
          cont.innerHTML = '<p class="text-error">Error al cargar</p>';
        }
      }

      document.getElementById('btn-refresh').addEventListener('click', cargarViajes);

      // ============================================================
      // INICIALIZAR
      // ============================================================
      await verificarEstadoDia();
      await cargarEscuelas();
      await cargarViajes();

      setInterval(verificarEstadoDia, 30000);
      setInterval(cargarViajes, 10000);

    })();
  </script>

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.warn('SW falló:', err));
      });
    }
  </script>

</body>
</html>
