<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D32F2F">
  <title>Ingresar — Control Electoral 2026</title>

  <link rel="icon" type="image/png" href="assets/img/logo-lista1.png">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">

      <div class="login-header">
        <img src="assets/img/logo-lista1.png" alt="Logo Lista 1" class="login-logo" onerror="this.style.display='none'">
        <h1 class="login-titulo">Control Electoral 2026</h1>
        <p class="login-subtitulo">Lista 1 — Pablo Alderete Concejal</p>
      </div>

      <form id="form-login" class="login-body" autocomplete="off">
        <div id="login-error" class="login-error"></div>

        <div class="form-group">
          <label for="usuario" class="form-label">Usuario</label>
          <div class="form-input-group">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="text"
              id="usuario"
              name="usuario"
              class="form-input"
              placeholder="Ingresá tu usuario"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label for="credencial" class="form-label">Contraseña o PIN</label>
          <div class="form-input-group">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="credencial"
              name="credencial"
              class="form-input"
              placeholder="Contraseña o PIN de 4 dígitos"
              autocomplete="current-password"
              required
            >
          </div>
          <span class="form-hint">Admin, Candidato y Coordinador: contraseña. Punteros, Voca y Choferes: PIN.</span>
        </div>

        <button type="submit" id="btn-ingresar" class="btn btn-primary btn-lg btn-block login-btn">
          Ingresar
        </button>
      </form>

      <div class="login-footer">
        <strong>Sistema interno</strong> · Uso exclusivo del equipo de campaña
      </div>

    </div>
  </div>

    <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/cache.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    /* ============================================================
       Lógica del login
       ============================================================ */
    (function () {

      // Si ya hay sesión activa, redirigir al panel correspondiente
      if (AUTH.haySesion()) {
        const u = AUTH.usuarioActual();
        if (u && u.rol) {
          AUTH.irAPanel(u.rol);
          return;
        }
      }

      const form = document.getElementById('form-login');
      const inputUsuario = document.getElementById('usuario');
      const inputCred = document.getElementById('credencial');
      const btnIngresar = document.getElementById('btn-ingresar');
      const errorBox = document.getElementById('login-error');

      function mostrarError(mensaje) {
        errorBox.textContent = mensaje;
        errorBox.classList.add('visible');
      }

      function ocultarError() {
        errorBox.classList.remove('visible');
        errorBox.textContent = '';
      }

      function bloquear(b) {
        inputUsuario.disabled = b;
        inputCred.disabled = b;
        btnIngresar.disabled = b;
        btnIngresar.innerHTML = b
          ? '<span class="spinner"></span> Ingresando...'
          : 'Ingresar';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        ocultarError();

        const usuario = inputUsuario.value.trim();
        const credencial = inputCred.value.trim();

        if (!usuario || !credencial) {
          mostrarError('Completá usuario y credencial');
          return;
        }

        bloquear(true);

        try {
          const data = await API.login(usuario, credencial);

          // Guardar sesión
          UTILS.guardarSesion(data.token, data.usuario, data.expira);

          // Redirigir al panel según rol
          AUTH.irAPanel(data.usuario.rol);

        } catch (err) {
          bloquear(false);
          mostrarError(err.message || 'Error al ingresar');
          inputCred.value = '';
          inputCred.focus();
        }
      });

    })();
  </script>

</body>
</html>
